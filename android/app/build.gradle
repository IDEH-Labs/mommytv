plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing comes only from the environment (KEYSTORE_PATH, KEY_ALIAS, STORE_PASSWORD, KEY_PASSWORD);
// no key or password is ever stored in the repository.
def releaseKeystorePath = System.getenv('KEYSTORE_PATH')
def releaseSigningConfigured = releaseKeystorePath && file(releaseKeystorePath).isFile()

android {
    namespace 'org.jpi59.mommytv'
    compileSdk = 37
    compileSdkMinor = 2

    defaultConfig {
        applicationId 'org.jpi59.mommytv'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.1.2'
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                keyAlias System.getenv('KEY_ALIAS')
                storePassword System.getenv('STORE_PASSWORD')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    // No encrypted dependency block for Google: the APK carries no metadata the user cannot read
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
            merges += ['/META-INF/LICENSE', '/META-INF/LICENSE.txt', '/META-INF/NOTICE', '/META-INF/NOTICE.txt']
        }
    }
}

configurations.configureEach { configuration ->
    resolutionStrategy {
        if (configuration.name != 'androidLintTool') {
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Media3 (Apache 2.0): Google's own player, HLS included
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    testImplementation 'junit:junit:4.13.2'
}
